image: mcr.microsoft.com/dotnet/sdk:8.0

clone:
  depth: full

pipelines:
  default:
    - parallel:
        - step:
            name: Build and Test
            caches:
              - dotnetcore
            script:
              - REPORTS_PATH=./test-reports/build_${BITBUCKET_BUILD_NUMBER}
              - dotnet restore
              - dotnet build --no-restore --configuration Release
              - dotnet test --no-build --configuration Release --test-adapter-path:. --logger:"junit;LogFilePath=$REPORTS_PATH/junit.xml"
            artifacts:
              - test-reports/**
        - step:
            name: Lint the code
            caches:
              - dotnetcore
            script:
              - export SOLUTION_NAME=BadmintonBooking
              - export REPORTS_PATH=linter-reports
              - dotnet new tool-manifest
              - dotnet tool install JetBrains.ReSharper.GlobalTools
              - dotnet tool restore
              - dotnet jb inspectcode ${SOLUTION_NAME}.sln --output="${REPORTS_PATH}/jb-${BITBUCKET_BUILD_NUMBER}.xml"
            artifacts:
              - linter-reports/**
    
    - step:
        name: Build and Push Docker Images
        services:
          - docker
        script:
          - echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USER" --password-stdin
          # Build both images
          - docker compose build
          # Tag and push frontend
          - docker tag src_frontend ${DOCKER_HUB_USER}/badmintonbooking-frontend:${BITBUCKET_BUILD_NUMBER}
          - docker push ${DOCKER_HUB_USER}/badmintonbooking-frontend:${BITBUCKET_BUILD_NUMBER}
          # Tag and push backend
          - docker tag src_backend ${DOCKER_HUB_USER}/badmintonbooking-backend:${BITBUCKET_BUILD_NUMBER}
          - docker push ${DOCKER_HUB_USER}/badmintonbooking-backend:${BITBUCKET_BUILD_NUMBER}

    - step:
        name: Mirror to GitHub
        image: atlassian/default-image:4
        script:
          - git fetch --all
          - git fetch --tags
          - git push --mirror git@github.com:orangethefish/BadmintonBooking.git
