<div class="container mx-auto px-4 py-8">
  <div class="max-w-2xl mx-auto">
    <div class="mb-8">
      <h1 class="text-3xl font-bold mb-2">Create Courts</h1>
      <div class="w-full bg-gray-200 rounded-full h-2.5">
        <div class="bg-green-600 h-2.5 rounded-full" style="width: 100%"></div>
      </div>
      <p class="text-gray-600 mt-2">Step 2 of 2: Court Details</p>
    </div>

    <div *ngIf="facility" class="mb-8 p-4 bg-gray-50 rounded-lg">
      <h2 class="text-xl font-semibold mb-2">{{ facility.name }}</h2>
      <p class="text-gray-600">{{ facility.address }}</p>
    </div>

    <div class="mb-8">
      <h3 class="text-lg font-semibold mb-4">Added Courts</h3>
      <div *ngIf="courts.length === 0" class="text-gray-500">
        No courts added yet. Add your first court below.
      </div>
      <div *ngFor="let court of courts" class="flex items-center justify-between p-4 bg-white shadow rounded-lg mb-2">
        <span>{{ court.name }}</span>
      </div>
    </div>

    <form [formGroup]="courtForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Court Name</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500"
          [ngClass]="{'border-red-500': courtForm.get('name')?.invalid && courtForm.get('name')?.touched}"
        >
        <div *ngIf="courtForm.get('name')?.invalid && courtForm.get('name')?.touched" class="text-red-500 text-sm mt-1">
          <span *ngIf="courtForm.get('name')?.errors?.['required']">Court name is required</span>
          <span *ngIf="courtForm.get('name')?.errors?.['maxlength']">Name cannot exceed 50 characters</span>
        </div>
      </div>

      <div *ngIf="error" class="text-red-500 text-sm mt-2">{{ error }}</div>

      <div class="flex justify-between space-x-4">
        <button
          type="button"
          (click)="onFinish()"
          class="inline-flex justify-center py-2 px-4 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
        >
          Finish
        </button>
        <button
          type="submit"
          [disabled]="courtForm.invalid || isLoading"
          class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50"
        >
          <span *ngIf="isLoading" class="mr-2">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </span>
          Add Court
        </button>
      </div>
    </form>
  </div>
</div>
