<nav class="bg-white shadow-md fixed w-full z-50 top-0">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex items-center">
        <a routerLink="/" class="flex-shrink-0">
          <h1 class="text-2xl font-bold text-indigo-600 hover:text-indigo-700 transition-colors" i18n="Site title|The main title of the website, displayed in the navbar@@siteTitleNavbar">SmashCourt</h1>
        </a>
      </div>
      <div class="hidden md:flex items-center space-x-4">
        <a routerLink="/" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" routerLinkActive="text-indigo-600 bg-indigo-50" [routerLinkActiveOptions]="{exact: true}" i18n="Navigation link|Link to the home page@@navHome">Home</a>
        <a routerLink="/facilities" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" routerLinkActive="text-indigo-600 bg-indigo-50" i18n="Navigation link|Link to find courts page@@navFindCourts">Find Courts</a>
        <!-- Add other common links here -->

        <ng-container *ngIf="!isLoggedIn; else loggedInLinks">
          <a routerLink="/auth/login" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" routerLinkActive="text-indigo-600 bg-indigo-50" i18n="Navigation link|Link to login page@@navLogin">Login</a>
          <a routerLink="/auth/signup" class="ml-4 inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
            <ng-container i18n="Button text|Button to navigate to signup page@@navSignUp">Sign Up</ng-container>
          </a>
        </ng-container>
        <ng-template #loggedInLinks>
          <a routerLink="/dashboard" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" routerLinkActive="text-indigo-600 bg-indigo-50" i18n="Navigation link|Link to user dashboard@@navDashboard">Dashboard</a>
          <a routerLink="/my-bookings" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" routerLinkActive="text-indigo-600 bg-indigo-50" i18n="Navigation link|Link to user's bookings page@@navMyBookings">My Bookings</a>
          <button (click)="logout()" class="ml-4 inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
            <ng-container i18n="Button text|Button to log out the user@@navLogout">Logout</ng-container>
          </button>
        </ng-template>

      <div class="md:hidden flex items-center">

        <button type="button" class="text-gray-500 hover:text-gray-600 focus:outline-none focus:text-gray-600" aria-label="main menu" i18n-aria-label="Accessibility label|Label for the main menu button on mobile@@navMobileMenuLabel">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
          </svg>
        </button>
      </div>
